<!doctype html>
<html lang="en">

<head>

<script type="text/javascript" src='jquery.min.js'></script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* The badge that says a reading has just landed. It springs in rather than
   looping, because an arrival has a beginning and a loop does not. */
.arrived {
    width: 150px;
    height: 150px;
    margin: 6px auto;
    border-radius: 50%;
    background: #f07800;
    color: #fff;
    font: 700 21px/150px system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    animation: arrive .35s ease-out, breathe 1.6s ease-in-out .35s infinite;
}
@keyframes arrive  { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes breathe { 50% { transform: scale(1.04) } }
</style>

<script>
	function data_request_timer(){
		window.setInterval(get_data, 2000); //timer for running get_data() function every 2 seconds 
	}

	function get_data(){
		console.log("fetching data from server");

		$.get("read_data1.php", 
		function(data, status){
	    	document.getElementById("info").innerHTML = data;
	  	});

	}

</script>

</head>

<body onload="data_request_timer()">

<!--  This is where the data is displayed -->
<div style='border:0px solid blue; padding:0%;'>
    <p id='info'></p>
</div>


<!--  Dummy value insertion link -->
<button>
	<a style='text-decoration:none;font-size:12px' href='../insert_data.php?dist=65' target='_blank'>Insert dummy value</a>
</button>

</body>
</html>
